name: Bennett Literature Surveillance

on:
  schedule:
    # Fires every Friday 13:00 UTC; the script gates to a ~biweekly briefing.
    - cron: "0 13 * * 5"
  workflow_dispatch:
    # Manual trigger from the Actions UI. Defaults to bypassing the cadence gate, so a
    # hand-run always produces a briefing.
    inputs:
      force:
        description: "Run even if the last briefing was recent"
        type: boolean
        default: true

permissions:
  contents: write   # needed to commit the updated state.json back to the repo

jobs:
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install 'requests>=2.31' 'anthropic>=1.3'

      # The cron fires weekly; run_surveillance.py decides whether a briefing is
      # actually due (~every 12 days). A weekly cron with an in-script gate keeps the
      # cadence from drifting to a month whenever a run fails.
      - name: Run surveillance scan
        env:
          FORCE_RUN:          ${{ inputs.force }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          NCBI_API_KEY:       ${{ secrets.NCBI_API_KEY }}
        run: python surveillance/run_surveillance.py

      - name: Commit updated state file
        run: |
          git config user.name  "bennett-care-bot"
          git config user.email "actions@github.com"
          git add surveillance/state.json
          # Only commit if the state file actually changed
          git diff --staged --quiet || git commit -m "chore: update surveillance state [skip ci]"
          git push
