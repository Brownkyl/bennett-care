[project]
name = "bennett-care"
version = "0.1.0"
description = "Local, private toolkit for analyzing Bennett's seizure log and generating clinic-visit summaries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kyle Brown" }]

dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "click>=8.1",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
bennett-care = "bennett_care.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bennett_care"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
